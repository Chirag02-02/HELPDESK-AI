# ============================================================
# AI Helpdesk — Example Configuration
# ============================================================

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Admin Registration
app.admin-registration-code=${ADMIN_REGISTRATION_CODE}

# Groq AI
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY}
groq.api.model=llama3-70b-8192

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.helpdesk=INFO
logging.level.org.springframework.security=INFO

# Hybrid RAG & Embedding
rag.embedding.api-url=https://api-inference.huggingface.co/pipeline/feature-extraction/sentence-transformers/all-MiniLM-L6-v2
rag.embedding.api-key=${HUGGINGFACE_API_KEY:}
rag.embedding.dimension=384
rag.embedding.model-name=sentence-transformers/all-MiniLM-L6-v2

rag.keyword.weight=0.4
rag.vector.weight=0.6
rag.keyword.top-k=5
rag.vector.top-k=5
rag.hybrid.top-k=3
rag.vector.min-similarity=0.30
rag.hybrid.min-score=0.35
