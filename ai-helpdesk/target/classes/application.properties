# ============================================================
#  AI Helpdesk — Application Configuration 1
# ============================================================

# Server
server.port=8080

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/ai_helpdesk?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Chirag@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── JWT ──────────────────────────────────────────────────────
app.jwt.secret=U3VwZXJTZWNyZXRLZXlGb3JTcHJpbmdCb290QXBwbGljYXRpb25XaXRoQXRMZWFzdDI1NkJpdHM=
app.jwt.expiration-ms=86400000

# ── Admin Registration ─────────────────────────────────────────
# Anyone signing up with role=ADMIN or role=AGENT must supply this code.
# Change this to your own secret value, and don't commit the real value to a public repo.
app.admin-registration-code=123

# ── Groq AI API ──────────────────────────────────────────────
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=${GROQ_API_KEY:your_groq_api_key_here}
groq.api.model=llama3-70b-8192

# ── Email (Gmail SMTP) ────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=your_email@gmail.com

# ── Swagger / OpenAPI ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Actuator ─────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# ── Logging ──────────────────────────────────────────────────
logging.level.com.helpdesk=DEBUG
logging.level.org.springframework.security=INFO

# ── Hybrid RAG & Embedding Configuration ──────────────────────
rag.embedding.api-url=https://api-inference.huggingface.co/pipeline/feature-extraction/sentence-transformers/all-MiniLM-L6-v2
rag.embedding.api-key=${HUGGINGFACE_API_KEY:}
rag.embedding.dimension=384
rag.embedding.model-name=sentence-transformers/all-MiniLM-L6-v2

rag.keyword.weight=0.4
rag.vector.weight=0.6
rag.keyword.top-k=5
rag.vector.top-k=5
rag.hybrid.top-k=3
rag.vector.min-similarity=0.30
rag.hybrid.min-score=0.35

